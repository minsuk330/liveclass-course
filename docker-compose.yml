services:
  mysql:
    image: mysql:8.4
    container_name: course-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: course
      MYSQL_USER: course
      MYSQL_PASSWORD: course
      TZ: Asia/Seoul
    ports:
      - "3311:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - course-mysql-data:/var/lib/mysql

volumes:
  course-mysql-data:
