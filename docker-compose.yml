services:
  app:
    build:
      context: .
    container_name: course-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/course?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: course
      SPRING_DATASOURCE_PASSWORD: course
      TZ: Asia/Seoul
    ports:
      - "8080:8080"

  mysql:
    image: mysql:8.4
    container_name: course-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: course
      MYSQL_USER: course
      MYSQL_PASSWORD: course
      TZ: Asia/Seoul
    ports:
      - "3311:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - course-mysql-data:/var/lib/mysql

volumes:
  course-mysql-data:
